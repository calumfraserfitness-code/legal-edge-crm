name: Fix LinkedIn URL display

on:
  push:
    paths:
      - '.github/workflows/fix-linkedin-url-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LinkedIn URL display
        shell: python
        run: |
          from pathlib import Path

          files = [Path('index.html'), Path('CRM.html')]

          old_detail = '''document.getElementById('dp-linkedin').innerHTML=l.linkedin?`<a href=\\"${l.linkedin.startsWith('http')?l.linkedin:'https://'+l.linkedin}\\" target=\\"_blank\\">View Profile ↗</a>`:'—';'''
          new_detail = '''{const linkedinUrl=l.linkedin||l.linkedin_url||l.linkedinUrl||l.profileUrl||(l.data&&(l.data.linkedin||l.data.linkedin_url||l.data.linkedinUrl||l.data.profileUrl))||'';document.getElementById('dp-linkedin').innerHTML=linkedinUrl?`<a href=\\"${linkedinUrl.startsWith('http')?linkedinUrl:'https://'+linkedinUrl}\\" target=\\"_blank\\" rel=\\"noopener\\" style=\\"word-break:break-all\\">${linkedinUrl}</a>`:'—';}'''

          old_dial = '''l.linkedin?`<a href=\\"${l.linkedin.startsWith('http')?l.linkedin:'https://'+l.linkedin}\\" target=\\"_blank\\" style=\\"color:rgba(255,255,255,.6);font-size:12px;text-decoration:none;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:20px\\">🔗 LinkedIn</a>`:'', '''
          new_dial = '''(l.linkedin||l.linkedin_url||l.linkedinUrl||l.profileUrl||(l.data&&(l.data.linkedin||l.data.linkedin_url||l.data.linkedinUrl||l.data.profileUrl)))?(()=>{const u=l.linkedin||l.linkedin_url||l.linkedinUrl||l.profileUrl||(l.data&&(l.data.linkedin||l.data.linkedin_url||l.data.linkedinUrl||l.data.profileUrl));return `<a href=\\"${u.startsWith('http')?u:'https://'+u}\\" target=\\"_blank\\" rel=\\"noopener\\" style=\\"color:rgba(255,255,255,.75);font-size:12px;text-decoration:none;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:20px;max-width:100%;word-break:break-all\\">🔗 ${u}</a>`})():'', '''

          changed = []
          for path in files:
            text = path.read_text(encoding='utf-8')
            before = text
            text = text.replace(old_detail, new_detail)
            text = text.replace(old_dial, new_dial)
            if text != before:
              path.write_text(text, encoding='utf-8')
              changed.append(path.name)

          if not changed:
            raise SystemExit('No matching LinkedIn display code found; refusing to make an unrelated change.')

          print('Patched:', ', '.join(changed))

      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          for name in ('index.html','CRM.html'):
            text=Path(name).read_text(encoding='utf-8')
            assert 'View Profile ↗' not in text, f'{name}: old LinkedIn label still present'
            assert '>🔗 LinkedIn</a>' not in text, f'{name}: old dial LinkedIn label still present'
            assert 'linkedinUrl' in text, f'{name}: URL fallback mapping missing'
          print('LinkedIn URL display verified in both CRM files.')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-linkedin-url-display.yml
          git config user.name "Legal Edge CRM Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html CRM.html .github/workflows/fix-linkedin-url-display.yml
          git commit -m "Show LinkedIn URLs on lead and dial views"
          git push
